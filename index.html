<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Page Title -->
    <title>Estusciagroup</title>

    <!-- SEO Description -->
    <meta
      name="description"
      content="Estuscia Group, also known as Estuscia, is a business and investment platform."
    />

    <!-- Canonical URL -->
    <link
      rel="canonical"
      href="https://estusciagroup.com/"
    />

    <!-- Favicon -->
    <link
      rel="icon"
      href="/favicon.ico"
    />

    <!-- Open Graph -->
    <meta
      property="og:title"
      content="estusciagroup"
    />

    <meta
      property="og:description"
      content="Estuscia Group, also known as Estuscia, is a business and investment platform."
    />

    <meta
      property="og:url"
      content="https://estusciagroup.com/"
    />

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:site_name"
      content="Estuscia Group"
    />

    <!-- WebSite Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Estuscia Group",
        "alternateName": [
          "Estuscia",
          "estusciagroup"
        ],
        "url": "https://estusciagroup.com/"
      }
    </script>

    <!-- Organization Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Estuscia Group",
        "alternateName": [
          "Estuscia",
          "estusciagroup"
        ],
        "url": "https://estusciagroup.com/"
      }
    </script>
  </head>

  <body>
    <!-- React Application -->
    <div id="root"></div>

    <!-- React / Vite Entry Point -->
    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>
